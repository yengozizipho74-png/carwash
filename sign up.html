<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ShineWash</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5ff, #eafff8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-box {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            color: #1769ff;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo span {
            color: #00c896;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .input-group {
            margin-bottom: 18px;
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #1769ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d55d6;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #667085;
        }

        .login-link a {
            color: #1769ff;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="register-box">

        <div class="logo">
            Shine<span>Wash</span>
        </div>

        <p class="subtitle">
            Create your customer account
        </p>

        <form onsubmit="registerUser(event)">

            <div class="row">

                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>

                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>

            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" required>
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <!-- JavaScript file -->
    <script src="signup.js"></script>

</body>

</html>
