<!DOCTYPE html>
<html>
<head>
<title>Admin Login - ShineWash</title>
<style>
body{font-family:Arial;background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:white;padding:30px;border-radius:12px;width:320px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
input{width:90%;padding:12px;margin:10px 0;border-radius:6px;border:1px solid #ccc}
button{width:95%;padding:12px;background:#1e40af;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:16px}
button:hover{background:#1e3a8a}
</style>
</head>
<body>
<div class="card">
<h2>👑 ShineWash Admin</h2>
<input id="email" type="email" placeholder="admin@shinewash.com" value="admin@shinewash.com">
<input id="password" type="password" placeholder="Password" value="admin123">
<button onclick="loginAdmin()">Login as Admin</button>
<p><a href="login.html">← Back to User Login</a></p>
<p id="msg" style="color:red;"></p>
</div>

<script>
// ADMIN LOGIN JAVASCRIPT - THIS IS THE JAVA YOU ASKED FOR
function loginAdmin(){
  let email = document.getElementById("email").value.trim();
  let pass = document.getElementById("password").value.trim();
  let msg = document.getElementById("msg");

  if(email === "admin@shinewash.com" && pass === "admin123"){
    localStorage.setItem("currentUser", "Admin");
    localStorage.setItem("userRole", "admin");
    window.location.href = "admin-dashboard.html";
  } else {
    msg.innerText = "Wrong! Use: admin@shinewash.com / admin123";
  }
}
</script>
</body>
</html>
