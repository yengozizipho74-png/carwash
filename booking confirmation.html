<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Booking Confirmed | ShineWash</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5ff, #eafff8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .confirmation {
            background: white;
            width: 500px;
            padding: 50px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .check {
            width: 80px;
            height: 80px;
            background: #d1fadf;
            color: #027a48;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            margin: 25px 0 10px;
        }

        p {
            color: #667085;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 25px;
            background: #1769ff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <div class="confirmation">

        <div class="check">
            ✓
        </div>

        <h1>Booking Confirmed!</h1>

        <p id="bookingMessage"></p>
            
         <p id="historyMessage"></p>

        <a class="btn" href="dashboard.html">
            Go to Dashboard
        </a>

    </div>
    <script src="confirmation.js"></script>

</body>
</html>
